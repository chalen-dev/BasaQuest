<!DOCTYPE html>

<!--
===============================================================================
START HERE: DEVELOPER / AI INTEGRATION GUIDE
===============================================================================
This is a standalone, vanilla HTML/CSS/JavaScript reading scene. It is a reusable
interface, not a complete learning backend. Preserve its tested visual behavior.

WHAT IS ALREADY CONNECTED
* Previous / Next: ten editable story pages, page boundaries, flexible SVG paper
  turns, attached moving text, and locked controls during each turn.
* Day / Night: existing palettes and localStorage persistence.
* Owl: clickable/keyboard-accessible mascot, HTML dialogue bubble, prepared
  replies, coordinated idle/listening/talking states, and reduced-motion support.
* Companion button: exclusive Owl / Notebook modes, sequential entrance/exit,
  saved mode, cancelled owl timers and disabled owl interaction in Notebook Mode.
* Microphone: local-only speech recognition where supported, otherwise a labeled
  simulation. It does NOT save recordings, assess reading, call an AI, or upload
  audio. In Notebook Mode it currently toggles the visual pulse only.

IMPORTANT GEOMETRY: DO NOT REVERSE THE BOOK
The canvas is 1670 x 941. The visible page is the LEFT-HAND page. The binding is
on its RIGHT at x=1594. Next brings the next sheet from the cropped-right side
leftward onto the current page. Previous lifts the current outer-left free edge
rightward into the cropped side, revealing the previous page underneath. Never move the binding to the outer-left edge or rotate the whole book.
The optimized 16-strip text bend and cached poses must remain intact.

WHERE TO EDIT CONTENT (search for these exact markers)
1. EDIT YOUR STORY HERE: replace title and paragraphs in const bookPages.
   Story text is real SVG text/tspan and wraps automatically. Keep it short.
2. EDIT OWL DIALOGUE HERE: replace/add strings in const owlDialogue.
3. NOTEBOOK HTML CONTENT SLOT: #notebookContent, a normal HTML div beside the
   artwork, positioned inside the notebook's blank page. Put text, forms, buttons,
   or a lesson component here. It is NOT SVG or foreignObject. Leave it empty
   for the original blank-notebook appearance.
4. APP INTEGRATION EXAMPLE below: add your application code in a new script AFTER
   the final existing script and BEFORE the closing body tag. The API is ready
   synchronously once this final script has run. Do not initialize it twice.

PUBLIC API: window.BookTabletop (preferred integration entry point)
  getState()                         -> fresh, read-only snapshot
  nextPage() / previousPage()         -> Promise; uses original navigation guards
  setTheme('day' | 'night')           -> boolean; false while theme is locked
  setCompanionMode('owl'|'notebook')   -> Promise; preserves transition guards
  showOwlMessage(text, {persistent})  -> boolean; respects companion/page state
  toggleMicrophone()                 -> boolean; use ONLY from a user activation
  setNotebookContent(Node | string)  -> safely replaces slot contents
  clearNotebookContent()
  notebookContent                    -> the slot element for mounting your UI

getState() fields:
  pageIndex (zero-based), pageNumber (one-based), pageCount, pageTurning,
  theme, companionMode, companionTransitioning, owlState, microphonePressed.
"microphonePressed" is the UI state, NOT proof that audio is being recorded.

STATE NOTIFICATIONS
  document.addEventListener('booktabletop:statechange', event => {
    const state = event.detail;
    // Update your app from the state. Avoid calling setters unconditionally here.
  });
Notifications describe current state, not successful reading or assessment.
For page-related work, check !state.pageTurning and compare pageIndex with the
previous value. Do not rely on an arbitrary 900ms timeout to detect completion.

APP INTEGRATION EXAMPLE (put in a new script after the final existing script)
  const api = window.BookTabletop;
  const panel = document.createElement('div');
  const heading = document.createElement('h2');
  heading.textContent = 'My reading notes';
  const paragraph = document.createElement('p');
  paragraph.textContent = 'What did you learn from this story?';
  const action = document.createElement('button');
  action.type = 'button';
  action.textContent = 'Next page';
  action.addEventListener('click', () => api.nextPage());
  panel.append(heading, paragraph, action);
  api.setNotebookContent(panel);
  // The panel appears when the user opens Notebook Mode.

The slot is automatically hidden and inert in Owl Mode and throughout companion
transitions. It appears only after the notebook settles. Its position updates on
resize, not every animation frame. Overflow scrolls within the page. Keep custom
controls responsive and use normal button labels/focus states. Scope custom CSS
under #notebookContent to avoid changing the scene's book/theme buttons.

WIRING A REAL APPLICATION
* Use the API for navigation; do not mutate currentPageIndex or data-page.
* Use setTheme; do not only recolor the DOM and forget persistence/lock state.
* Keep recording, speech-to-text, AI replies, reading assessment, scoring, and
  saving notes as separate services. None is implied by a success dialogue reply.
* Before adding microphone uploads, explain the new data flow and obtain the
  required consent. Never silently fall back from local recognition to a server.
* setOwlState alone is a visual helper, not a recording/session lifecycle API.
  Do not use it instead of the microphone controller's cleanup.
* Existing globals (showOwlMessage, handleOwlMicrophone, setCompanionMode) remain
  for compatibility. Prefer BookTabletop when adding new application features.

DO NOT BREAK THESE INVARIANTS
* One owl, one notebook, one HTML bubble; never duplicate the whole interface.
* Correct right-side hinge, page text traveling with paper, and boundary guards.
* No owl speech/timers/focus while Notebook Mode or a companion transition runs.
* Mode button retains a 16px clearance; notebook HTML stays within its content slot.
* Original palettes, full-screen responsive layout, and original SVG shapes.
* No raster embeddings, external packages, permanent frame loops, or animated blur.
* Honor reduced motion and hidden-tab cleanup. Reuse SVG nodes and cached poses.
* Persisted keys: book-tabletop-theme and book-companion-mode. Do not rename them
  without deliberately handling existing user preferences.

AFTER INTEGRATING: test navigation both ways, first/final page boundaries, theme
and companion persistence, owl speech, microphone cancellation, keyboard focus,
small screens, reduced motion, and rapid clicks. Test real recording separately
on the actual target laptops; the existing pulse is not a recording guarantee.
===============================================================================
END DEVELOPER / AI INTEGRATION GUIDE
===============================================================================
-->

<title>Book tabletop</title>
<script>
(function () {
 let saved;
 let companion;
 try { companion=localStorage.getItem('book-companion-mode'); } catch (_) {}
 document.documentElement.dataset.companion=companion==='notebook'?'notebook':'owl';
 try { saved = localStorage.getItem('book-tabletop-theme'); } catch (_) {}
 document.documentElement.dataset.theme = saved === 'day' || saved === 'night'
   ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
})();
</script>

<script>
(() => {
 // ================================================================
 // EDIT YOUR STORY HERE.
 // Replace each title and the strings inside its paragraphs array.
 // Add/remove entries to change the number of pages automatically.
 // Keep each page short (about 35–55 words). Lines wrap automatically.
 // ================================================================
 // BasaQuest integration: replaced the default 10-page demo story with a
 // short 2-page welcome flavor (see BookTabletopScene.tsx). This scene
 // only shows in the brief Owl-mode greeting/celebration moments —
 // the actual per-word practice content is injected into Notebook Mode
 // instead, so the story itself is decorative only, never instructional.
 const bookPages = [
  { title: "Welcome, Reading Coach!", paragraphs: [
    "Hoo! I'm so glad you're here.",
    "Let's practice some tricky words together, one at a time."
  ] },
  { title: "You've Got This", paragraphs: [
    "Take a breath, read slowly, and don't worry about mistakes.",
    "Every try makes you a stronger reader!"
  ] }
 ];
 // END OF EDITABLE STORY. Rendering and page-turn code follows.
 const root = document.documentElement, toggle = document.getElementById('theme-toggle');
 const artwork = document.querySelector('.artwork');
 const previous = document.getElementById('previous'), next = document.getElementById('next'), microphone = document.getElementById('microphone');
 const sheet = document.querySelector('.turning-sheet');
 const face = document.getElementById('sheet-face'), light = document.getElementById('sheet-light'), shadow = document.getElementById('moving-shadow');
 const gradient = document.getElementById('turn-paper'), highlight = document.getElementById('turn-fold-light');
 const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
 const totalPages = bookPages.length;
 let currentPageIndex = 0, busy = false;
 const syncTheme = () => toggle.setAttribute('aria-pressed', String(root.dataset.theme === 'night'));
 function disabled(control, value) { control.setAttribute('aria-disabled', String(value)); }
 function syncControls() {
  disabled(previous, busy || currentPageIndex === 0); disabled(next, busy || currentPageIndex === totalPages - 1); disabled(microphone, busy);
  toggle.disabled = busy;
  artwork.dataset.page = currentPageIndex + 1;
  artwork.dataset.pageCount = totalPages;
  artwork.setAttribute('aria-busy', String(busy));
 }
 // SVG-only layout: measure real text and wrap at word boundaries.
 const svgNS = 'http://www.w3.org/2000/svg';
 const stationaryStory = document.getElementById('stationary-story');
 const outgoingSource = document.getElementById('outgoing-story-source');
 const movingStory = document.getElementById('moving-story');
 const geometry = document.getElementById('turn-geometry');
 const shadowGradient = document.getElementById('turn-shadow-gradient');
 const restLight = document.getElementById('sheet-rest-light');
 const storyDefinitions = document.getElementById('story-definitions');
 let slices = [];
 const slicePool = [];
 // Cache measured layouts between visits. Story data is edited above, then reloaded.
 const storyCache = new WeakMap();
 function svgNode(name, attributes = {}) {
  const node = document.createElementNS(svgNS, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  return node;
 }
 function renderStory(target, entry) {
  const cached = storyCache.get(entry);
  if (cached) {
   target.replaceChildren(...cached.map(node => node.cloneNode(true)));
   target.dataset.title = entry.title;
   return;
  }
  target.replaceChildren();
  const left = 940, width = 576, top = 185, bottom = 545;
  // The reader area ends well above the control rings (their top is 581).
  const measure = svgNode('text', { class: 'story-text', visibility: 'hidden' });
  document.querySelector('.interaction-layer').append(measure);
  function wrap(text, size, weight) {
   measure.setAttribute('font-size', size); measure.setAttribute('font-weight', weight);
   const fits = value => { measure.textContent = value; return measure.getComputedTextLength() <= width; };
   const words = text.trim().split(/\s+/).filter(Boolean), lines = [];
   let line = '';
   for (const word of words) {
    if (fits(line ? line + ' ' + word : word)) { line += (line ? ' ' : '') + word; continue; }
    if (line) lines.push(line);
    line = '';
    // Very long words also stay within the page margins.
    for (const letter of word) {
     if (line && !fits(line + letter)) { lines.push(line); line = ''; }
     line += letter;
    }
   }
   if (line) lines.push(line);
   return lines;
  }
  let layout;
  for (let bodySize = 29; bodySize >= 19; bodySize--) {
   const titleSize = bodySize + 10, titleLines = wrap(entry.title, titleSize, 700);
   const paragraphLines = entry.paragraphs.map(text => wrap(text, bodySize, 400));
   let y = top;
   const rows = [{ lines: titleLines, size: titleSize, leading: titleSize * 1.22, y, className: 'story-title' }];
   y += titleLines.length * titleSize * 1.22 + 23;
   for (const lines of paragraphLines) {
    rows.push({ lines, size: bodySize, leading: bodySize * 1.48, y, className: 'story-body' });
    y += lines.length * bodySize * 1.48 + 18;
   }
   layout = rows;
   if (y - 18 <= bottom) break;
  }
  measure.remove();
  for (const row of layout) {
   const text = svgNode('text', { class: 'story-text ' + row.className, 'font-size': row.size });
   row.lines.forEach((line, index) => {
    const span = svgNode('tspan', { x: left, y: row.y + index * row.leading });
    span.textContent = line; text.append(span);
   });
   target.append(text);
  }
  target.dataset.title = entry.title;
  storyCache.set(entry, Array.from(target.children, node => node.cloneNode(true)));
 }
 function prepareMovingStory(entry) {
  renderStory(outgoingSource, entry);
  if (slicePool.length) {
   slices = slicePool;
   for (const p of slices) { p.back = null; storyDefinitions.append(p.clip); movingStory.append(p.carrier); }
   return;
  }
  // Narrow vector strips approximate the curved surface. The source remains
  // ordinary editable SVG text; there are no images, paths-as-letters or canvas.
  // 16 strips keep text attached to the bend with less clipping and painting work.
  const step = (1520 - 936) / 16;

  companionMode=mode;root.dataset.companion=mode;scene.dataset.companion=mode;
  const isOwl=mode===CompanionMode.OWL;
  owlLayer.style.transform=isOwl?'translate(0px,0px)':'translate(-650px,-1600px)';
  owlLayer.style.visibility=isOwl?'visible':'hidden';owlLayer.style.opacity='1';
  notebookLayer.style.transform=isOwl?'translateX(-2000px)':'translateX(0px)';
  notebookLayer.style.visibility=isOwl?'hidden':'visible';notebookLayer.style.opacity='1';
  notebookLayer.setAttribute('aria-hidden',String(isOwl));
  owl.setAttribute('aria-hidden',String(!isOwl));owl.setAttribute('tabindex',isOwl?'0':'-1');
  companionTransitioning=false;scene.dataset.companionTransitioning='false';
  owlLayer.style.willChange='';notebookLayer.style.willChange='';
  if(isOwl)window.resumeOwlCompanion();else window.suspendOwlCompanion();
  owl.setAttribute('aria-disabled',String(!isOwl||!!pageTurning()));
  updateButton();
 }
 async function animate(element,keyframes,duration,easing='ease-in-out'){
  if(document.hidden){const last=keyframes[keyframes.length-1];for(const key of ['transform','opacity'])if(key in last)element.style[key]=last[key];return;}
  element.style.willChange='transform, opacity';
  const animation=element.animate(keyframes,{duration,easing,fill:'forwards'});animations.add(animation);
  try{await animation.finished;}finally{animations.delete(animation);}
 }
 async function setCompanionMode(mode){
  if(!Object.values(CompanionMode).includes(mode)||mode===companionMode||companionTransitioning||pageTurning())return;
  companionTransitioning=true;scene.dataset.companionTransitioning='true';updateButton();
  window.suspendOwlCompanion();owl.setAttribute('tabindex','-1');owl.setAttribute('aria-disabled','true');
  // Freeze scene-relative placement; only wrappers move during transitions.
  try{
   if(mode===CompanionMode.NOTEBOOK){
    if(reduced.matches){
     await animate(owlLayer,[{opacity:1},{opacity:0}],100);
    }else{
     await animate(owlLayer,[
      {transform:'translate(0px,0px) scale(1)',offset:0},
      {transform:'translate(0px,8px) scale(1.025,.965)',offset:.18},
      {transform:'translate(-95px,-280px) rotate(-6deg)',offset:.55},
      {transform:'translate(-650px,-1600px) rotate(-12deg)',offset:1}
     ],500,'cubic-bezier(.45,0,.85,.55)');
    }
    owlLayer.style.visibility='hidden';
    notebookLayer.style.visibility='visible';
    if(reduced.matches){notebookLayer.style.transform='translateX(0px)';await animate(notebookLayer,[{opacity:0},{opacity:1}],120);}
    else await animate(notebookLayer,[{transform:'translateX(-2000px)',offset:0},{transform:'translateX(6px)',offset:.9},{transform:'translateX(0px)',offset:1}],580,'cubic-bezier(.18,.72,.25,1)');
   }else{
    if(reduced.matches)await animate(notebookLayer,[{opacity:1},{opacity:0}],120);
    else await animate(notebookLayer,[{transform:'translateX(0px)'},{transform:'translateX(-2000px)'}],550,'cubic-bezier(.55,.05,.8,.4)');
    notebookLayer.style.visibility='hidden';owlLayer.style.visibility='visible';
    if(reduced.matches){owlLayer.style.transform='translate(0px,0px)';await animate(owlLayer,[{opacity:0},{opacity:1}],120);}
    else await animate(owlLayer,[
     {transform:'translate(-650px,-1600px) rotate(-12deg)',offset:0},
     {transform:'translate(-35px,-140px) rotate(-3deg)',offset:.55},
     {transform:'translate(0px,6px) scale(1.02,.97)',offset:.82},
     {transform:'translate(0px,0px) scale(1)',offset:1}
    ],640,'cubic-bezier(.2,.55,.4,1)');
   }
  }catch(_){/* Interrupted motion resolves directly to the requested valid state. */}
  finally{
   // Inline final transforms take over before animation effects are discarded.
   commit(mode);
   for(const element of [owlLayer,notebookLayer])for(const animation of element.getAnimations())animation.cancel();
   try{localStorage.setItem('book-companion-mode',mode);}catch(_){}
  }
 }
 function showNotebookMode(){return setCompanionMode(CompanionMode.NOTEBOOK);}
 function showOwlMode(){return setCompanionMode(CompanionMode.OWL);}
 button.addEventListener('click',()=>setCompanionMode(companionMode===CompanionMode.OWL?CompanionMode.NOTEBOOK:CompanionMode.OWL));
 new MutationObserver(updateButton).observe(scene,{attributes:true,attributeFilter:['data-phase','data-busy']});
 new ResizeObserver(placeNotebook).observe(scene.parentElement);
 // Settle interrupted transitions without a partially visible companion.
 function settleMotion(){for(const animation of animations){try{animation.finish();}catch(_){animation.cancel();}}}
 document.addEventListener('visibilitychange',()=>{if(document.hidden)settleMotion();});
 reduced.addEventListener('change',()=>{if(reduced.matches)settleMotion();});
 window.setCompanionMode=setCompanionMode;window.showNotebookMode=showNotebookMode;window.showOwlMode=showOwlMode;
 placeNotebook();commit(companionMode);
})();

</script>
<script>
// Stable integration facade. Existing controllers remain the source of truth.
(function setupIntegrationAPI(){
 const scene=document.querySelector('.artwork'),root=document.documentElement;
 const slot=document.getElementById('notebookContent'),toggle=document.getElementById('theme-toggle');
 const owl=document.getElementById('owl-mascot'),mic=document.getElementById('microphone');
 function getState(){return Object.freeze({
  pageIndex:Number(scene.dataset.page||1)-1,pageNumber:Number(scene.dataset.page||1),pageCount:Number(scene.dataset.pageCount||0),
  pageTurning:scene.dataset.busy==='true'||!!(scene.dataset.phase&&scene.dataset.phase!=='idle'),
  theme:root.dataset.theme,companionMode:root.dataset.companion,
  companionTransitioning:scene.dataset.companionTransitioning==='true',
  owlState:owl.dataset.state,microphonePressed:mic.getAttribute('aria-pressed')==='true'
 });}
 function positionSlot(){
  // Read only on resize/placement events; never during an animation frame loop.
  const m=document.getElementById('notebook-placement').transform.baseVal.consolidate()?.matrix;
  if(!m)return;
  const f=scene.clientWidth/1670,parent=scene.parentElement;
  slot.style.left=(parent.clientWidth-scene.clientWidth+(m.e+160*m.a)*f)+'px';
  slot.style.top=((parent.clientHeight-scene.clientHeight)/2+(m.f+170*m.d)*f)+'px';
  slot.style.width=(576*m.a*f)+'px';slot.style.height=(610*m.d*f)+'px';
  slot.style.fontSize=Math.max(14,Math.min(26,26*m.a*f))+'px';
 }
 function sync(){
  const state=getState();const active=state.companionMode==='notebook'&&!state.companionTransitioning;
  slot.inert=!active;slot.setAttribute('aria-hidden',String(!active));
  document.dispatchEvent(new CustomEvent('booktabletop:statechange',{detail:state}));
 }
 const observer=new MutationObserver(sync);
 observer.observe(scene,{attributes:true,attributeFilter:['data-page','data-phase','data-busy','data-companion-transitioning','data-companion']});
 observer.observe(root,{attributes:true,attributeFilter:['data-theme','data-companion']});
 observer.observe(owl,{attributes:true,attributeFilter:['data-state']});
 observer.observe(mic,{attributes:true,attributeFilter:['aria-pressed']});
 scene.addEventListener('notebook-layout',positionSlot);
 window.BookTabletop=Object.freeze({
  getState,
  nextPage:()=>window.bookNavigation.next(),previousPage:()=>window.bookNavigation.previous(),
  setTheme(mode){if(!['day','night'].includes(mode)||toggle.disabled)return false;if(root.dataset.theme!==mode)toggle.click();return true;},
  setCompanionMode:mode=>window.setCompanionMode(mode),
  showOwlMessage:(message,options)=>window.showOwlMessage(message,options),
  toggleMicrophone(){if(mic.getAttribute('aria-disabled')==='true')return false;window.handleOwlMicrophone();return true;},
  setNotebookContent(content){
   if(typeof content==='string')slot.textContent=content;
   else if(content instanceof Node)slot.replaceChildren(content);
   else throw new TypeError('Notebook content must be a DOM Node or plain string.');
  },
  clearNotebookContent(){slot.replaceChildren();},
  notebookContent:slot
 });
 positionSlot();sync();
})();

</script>
