  }
}

  const silent=context.createGain();silent.gain.value=0;analyser.connect(silent);silent.connect(context.destination);
  await context.resume();if(capture!==session)return;
  const recorder=session.recorder=new MediaRecorder(session.stream,{audioBitsPerSecond:32000});
  recorder.ondataavailable=e=>{if(e.data.size)session.chunks.push(e.data)};
  recorder.onerror=()=>{session.failed=true;message('Recording failed. Please try again.');complete(session)};
  recorder.onstop=()=>{
   if(capture!==session)return;
   if(!session.failed&&session.chunks.length){
    const blob=new Blob(session.chunks,{type:recorder.mimeType});
    verifyTake(session.index,blob);
   }
   complete(session);
  };
  session.stream.getAudioTracks()[0].onended=()=>{if(capture===session){message('Microphone disconnected.');stopCapture()}};
  /* Same equalizer as the reading assessment (useRecorder + Waveform): 36 log-spaced voice bands, instant attack,
     eased release, 18 bars a side sampled from them, the left side mirrored. */
  const data=new Uint8Array(analyser.frequencyBinCount),wave=new Uint8Array(analyser.fftSize),nyq=context.sampleRate/2,N=36,edges=[],shown=new Array(N).fill(0);
  for(let i=0;i<=N;i++){const hz=60*Math.pow(8000/60,i/N);edges.push(Math.min(analyser.frequencyBinCount-1,Math.max(0,Math.round(hz/nyq*analyser.frequencyBinCount))))}
  function draw(time){
   if(capture!==session||micState!=='recording')return;
   if(!session.last||time-session.last>(reduced.matches?250:0)){
    session.last=time;analyser.getByteFrequencyData(data);
    /* Auto-stop: once the word has been heard (voice for a moment) and it then goes quiet for 0.8s, the take ends by itself. */
    analyser.getByteTimeDomainData(wave);let sq=0;for(let k=0;k<wave.length;k++){const v=(wave[k]-128)/128;sq+=v*v}
    if(Math.sqrt(sq/wave.length)>0.02){session.voiced=(session.voiced||0)+1;session.quietSince=0}else if(!session.quietSince)session.quietSince=time;
    if(session.voiced>=6&&session.quietSince&&time-session.quietSince>800){stopCapture();return}
    for(let i=0;i<N;i++){const lo=edges[i],hi=Math.max(lo+1,edges[i+1]);let sum=0;for(let k=lo;k<hi;k++)sum+=data[k]||0;const target=Math.min(1,Math.pow(sum/(hi-lo)/255,.55));shown[i]=target>=shown[i]?target:shown[i]+(target-shown[i])*.35}
    for(let i=0;i<18;i++){const t='scaleY('+Math.max(.08,Math.min(1,shown[i*2]))+')';leftMeter.children[17-i].style.transform=t;rightMeter.children[i].style.transform=t}
   }
   session.frame=requestAnimationFrame(draw);
  }
  recorder.onstart=()=>{if(capture!==session)return;showMic('recording');mic.dataset.count='go';mic.lastElementChild.textContent='Go!';setTimeout(()=>{if(micState==='recording'){delete mic.dataset.count;mic.lastElementChild.textContent='Stop'}},700);draw(performance.now());session.t0=performance.now();tickTimer(session);session.tick=setInterval(()=>tickTimer(session),100);session.limit=setTimeout(()=>{if(capture===session&&micState==='recording')stopCapture()},REC_LIMIT*1000)};
  runCountdown(session,()=>recorder.start());
 }catch(error){
  if(capture!==session)return;
  message(error.name==='NotAllowedError'?'Microphone access was denied. Allow it in your browser to record.':error.name==='NotFoundError'?'No microphone found. Connect one and try again.':'Could not start recording. Check your microphone and browser settings.');
  complete(session);
 }
}

   wordPracticeLoad(list): swap in the pupil's real words [{word,type,count,tip,practiced}].

   wordPracticeSpeak(word): optional, replaces the browser voice for "Hear it". */
