html[data-theme] section:after{background:linear-gradient(color-mix(in srgb,#8a7b96,#efc595 var(--day-mix)),color-mix(in srgb,#70617e,#c39064 var(--day-mix)) 42%,color-mix(in srgb,#4a3d57,#9b7252 var(--day-mix)))}

.sunscape circle{transform:translate(calc(-26px * (1 - var(--sunlight))),calc(120px * (1 - var(--sunlight))))}

html[data-theme] .window>path:nth-of-type(3){fill:color-mix(in srgb,#333658,#689981 var(--day-mix))}
html[data-theme] .window>g:not(.sunscape){stroke:color-mix(in srgb,#82758d,#bb906c var(--day-mix))}
html[data-theme] .window>rect:last-child{fill:color-mix(in srgb,#867991,#d9ad81 var(--day-mix))}

  --tile-light:color-mix(in srgb,var(--tile) 61%,#858098);
  --tile-shade:color-mix(in srgb,var(--tile) 49%,#716c83);

}

  background:linear-gradient(color-mix(in srgb,var(--control-high,#d6cfe4),#fff8e7 var(--day-mix)),color-mix(in srgb,var(--control-low,#b6a9c9),#edd8b4 var(--day-mix)))
}

<script>

document.querySelector('.back-button').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'letters:exit'},location.origin);else window.history.back()});
const themeSwitch=document.querySelector('#theme');
function setTheme(night){
  document.documentElement.dataset.theme=night?'night':'day';
  themeSwitch.setAttribute('aria-checked',String(night));
}
let savedNight=true;
try{savedNight=localStorage.getItem('alphabet-classroom-theme')!=='day'}catch{}
setTheme(savedNight);
const room=document.documentElement;
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let daylight=savedNight?0:1;
let targetLight=daylight;
let lightingFrame=0;
let previousTime=0;
// Stops run from moonlit indigo through violet, pink and peach to daylight.
const skyStops=[
  ['#15173f','#7272bd'],['#665389','#a68ab2'],['#ad779d','#edaab7'],
  ['#f0ad91','#ffdfad'],['#72cafa','#daeff9']
];
function lightRoom(){
  const t=daylight*daylight*(3-2*daylight);
  room.style.setProperty('--sunlight',t);
  room.style.setProperty('--day-mix',(100*t)+'%');
  const position=t*(skyStops.length-1);
  const stop=Math.min(Math.floor(position),skyStops.length-2);
  for(const [i,key] of ['--sky-high','--sky-low'].entries()){
    room.style.setProperty(key,'color-mix(in srgb,'+skyStops[stop][i]+','+skyStops[stop+1][i]+' '+(100*(position-stop))+'%)');
  }
}
function advanceLighting(time){
  const step=(time-previousTime)/2500;
  previousTime=time;
  daylight=targetLight>daylight?Math.min(targetLight,daylight+step):Math.max(targetLight,daylight-step);
  lightRoom();
  lightingFrame=daylight===targetLight?0:requestAnimationFrame(advanceLighting);
}
function finishLighting(){
  cancelAnimationFrame(lightingFrame);
  lightingFrame=0;
  daylight=targetLight;
  lightRoom();
}
lightRoom();
motionPreference.addEventListener('change',()=>{if(motionPreference.matches)finishLighting()});
themeSwitch.onclick=()=>{
  targetLight=1-targetLight;
  setTheme(targetLight===0);
  try{localStorage.setItem('alphabet-classroom-theme',room.dataset.theme)}catch{}
  if(motionPreference.matches){finishLighting();return}
  if(!lightingFrame){previousTime=performance.now();lightingFrame=requestAnimationFrame(advanceLighting)}
};

const letters=Array.from('abcdefghijklmnopqrstuvwxyz');
const words='apple banana carabao duck egg fish goat hen ink jeepney kite lemon mango nest ox papaya queen rice sun tiger umbrella van watermelon box yo-yo zebra'.split(' ');
const icons=Array.from('🍎🍌🚗🦆🥚🐟🐐🐔🖋🪼🪁🍋🥭🪺🍊🍈👸🍚🌻🐯☂🚐🍉🎶🧶🦓');
const colors=['#ffb5bb','#ffe28e','#d4b9ed','#ffccaa','#a5dbf2','#a8e5c6'];
/* Each letter has a list of objects (word + emoji); the first is the main one. The host page sends them
   with lettersLoad; until then each letter shows its main word. Tap the picture to see the next object. */
const objects=words.map(w=>[{word:w,image:''}]);
let curObj=0;
const emojiSvg=e=>'<svg class="art" aria-hidden="true" viewBox="0 0 64 58"><text x="32" y="46" font-size="46" text-anchor="middle">'+(e||'?')+'</text></svg>';
const imageSvg=u=>'<svg class="art" aria-hidden="true" viewBox="0 0 64 58"><image href="'+encodeURI(u)+'" x="2" y="1" width="60" height="56" preserveAspectRatio="xMidYMid meet"/></svg>';
const artHtml=o=>(o.imageUrl?imageSvg(o.imageUrl):(window.LETTER_ART&&window.LETTER_ART[o.word])||emojiSvg(o.image));
function renderPicture(){
  const p=document.querySelector('#picture'),list=objects[selected],o=list[curObj],many=list.length>1;
  p.innerHTML=artHtml(o);
  p.classList.toggle('many',many);p.tabIndex=many?0:-1;
  p.setAttribute('role',many?'button':'img');p.setAttribute('aria-label',many?'Show another picture':o.word);
  document.querySelector('.dots').innerHTML=many?list.map((_,k)=>'<i'+(k===curObj?' class="on"':'')+'></i>').join(''):'';
}
function nextObject(){if(objects[selected].length>1){hello=false;curObj=(curObj+1)%objects[selected].length;show(selected,true)}}
const nav=document.querySelector('nav');
let selected=0;
words.forEach((word,i)=>{const button=document.createElement('button');button.style.setProperty('--tile',colors[i%6]);button.setAttribute('aria-label',letters[i].toUpperCase()+' for '+word);button.innerHTML='<span class="tile-letter">'+letters[i].toUpperCase()+letters[i]+'</span><span aria-hidden="true">'+artHtml(objects[i][0])+'</span>';button.onclick=()=>userShow(i);nav.append(button)});
const sounds='a b k d e f g h i j k l m n o p kw r s t u v w ks y z'.split(' ');
function renderBubble(letter,word,index){
  const hint=document.createElement('span');
  hint.className='sound-hint';
  hint.textContent=letter+letters[index]+' says /'+sounds[index]+'/. ';
  document.querySelector('.bubble').replaceChildren(hint,word[0].toUpperCase()+word.slice(1)+'!');
}
function fitIllustration(){
  const art=document.querySelector('#picture svg');if(!art)return;const vb0=art.dataset.vb||(art.dataset.vb=art.getAttribute('viewBox'));
  const bounds=art.getBBox();
  const padding=Math.max(2,Math.max(bounds.width,bounds.height)*.035);
  if(matchMedia('(min-width:761px)').matches){
    art.setAttribute('viewBox',[bounds.x-padding,bounds.y-padding,bounds.width+2*padding,bounds.height+2*padding].join(' '));
  }else{
    art.setAttribute('viewBox',vb0);
  }
}
matchMedia('(min-width:761px)').addEventListener('change',fitIllustration);
function show(i,keep){selected=(i+26)%26;if(!keep)curObj=0;const word=objects[selected][curObj].word,letter=letters[selected].toUpperCase();document.querySelector('h1').textContent=letter+letters[selected];document.querySelector('.word').textContent=word;document.querySelector('.phrase').innerHTML=letter+(word[0]===letters[selected]?' is for ':' is at the end of ')+'<b>'+word+'</b>';renderBubble(letter,word,selected);document.querySelector('small').textContent='Letter '+(selected+1)+' of 26';renderPicture();fitIllustration();Array.from(nav.children).forEach((b,n)=>b.setAttribute('aria-pressed',n===selected));document.querySelector('progress').value=selected+1;revealSelection();stopAudio()}
document.querySelector('#prev').onclick=()=>userShow(selected-1);document.querySelector('#next').onclick=()=>userShow(selected+1);document.onkeydown=e=>{if(e.key==='ArrowRight')userShow(selected+1);if(e.key==='ArrowLeft')userShow(selected-1)};
/* The owl greets first and asks for a letter; the first real pick replaces the greeting. */
let hello=true;
function userShow(i){hello=false;show(i)}
function showHello(){document.querySelector('.bubble').textContent='Hi! Tap a letter at the top to start.';if(typeof setOwl==='function')setOwl('encouraging',false)}

const hear=document.querySelector('.hear');
const owlSlot=document.querySelector('.owl');
const rig=window.BasaOwl?window.BasaOwl.mountOwl(owlSlot,{variant:'full'}):null;
function setOwl(emotion,talking){if(rig){rig.setEmotion(emotion);rig.setTalking(talking)}}
let hearLoading=false;
function stopAudio(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(window.parent!==window)window.parent.postMessage({type:'letters:stop'},location.origin);
  setOwl('neutral',false);
}
hear.onclick=()=>{
  if(hearLoading)return;
  const word=objects[selected][curObj].word;
  if(window.lettersSpeak){window.lettersSpeak(word);return}
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const say=new SpeechSynthesisUtterance(word);say.lang='en-US';
    say.onstart=()=>setOwl('happy',true);say.onend=()=>setOwl('neutral',false);
    speechSynthesis.speak(say);
  }
};
/* Host hooks: lettersTalking(on) the voice is playing; lettersSpeaking(on) it is loading. */
window.lettersTalking=on=>setOwl(on?'happy':'neutral',!!on);
window.lettersSpeaking=on=>{hearLoading=!!on;hear.classList.toggle('is-loading',hearLoading);hear.setAttribute('aria-busy',String(hearLoading))};
window.addEventListener('pagehide',stopAudio);
const editBtn=document.querySelector('.edit-cards');
editBtn.onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'letters:edit'},location.origin)};
/* lettersCanEdit(on): the host says this person may edit the cards, so show the button. */
window.lettersCanEdit=on=>{editBtn.hidden=!on};
document.querySelector('#picture').onclick=nextObject;
document.querySelector('#picture').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextObject()}};
show(0);
showHello();
function revealSelection(){
  const tile=nav.children[selected];
  if(nav.scrollWidth>nav.clientWidth){
    const delta=tile.getBoundingClientRect().left-nav.getBoundingClientRect().left;
    nav.scrollLeft+=delta-(nav.clientWidth-tile.offsetWidth)/2;
  }
}
revealSelection();
/* lettersLoad(list): swap in the level's letters [{word,sound,image,extras:[{word,image}]}], one per letter A-Z in order. */
window.lettersLoad=list=>{
  if(!Array.isArray(list)||list.length!==26)return;
  words.splice(0,words.length,...list.map(l=>l.word));
  objects.splice(0,objects.length,...list.map(l=>[{word:l.word,image:l.image||'',imageUrl:l.imageUrl||''},...(l.extras||[])]));
  sounds.splice(0,sounds.length,...list.map(l=>l.sound));
  Array.from(nav.children).forEach((b,i)=>{b.setAttribute('aria-label',letters[i].toUpperCase()+' for '+words[i]);b.children[1].innerHTML=artHtml(objects[i][0])});
  show(selected);
  if(hello)showHello();
};
</script></html>
